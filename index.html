<!doctype html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07111f">
    <meta name="description"
        content="Portfolio of Abu Salah Musha Lemon — full-stack developer and creative technologist building practical web systems, responsive interfaces and applied digital experiences.">
    <meta name="author" content="Abu Salah Musha Lemon">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Abu Salah Musha Lemon — Full-Stack Developer">
    <meta property="og:description"
        content="Selected software projects, design work, research interests and professional experience.">
    <meta name="twitter:card" content="summary_large_image">
    <title>Abu Salah Musha Lemon — Full-Stack Developer</title>
    <link rel="icon" href="favicon.ico">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="noise" aria-hidden="true"></div>
    <div class="aurora aurora-one" aria-hidden="true"></div>
    <div class="aurora aurora-two" aria-hidden="true"></div>

    <header class="site-header" id="top">
        <div class="container nav-shell">
            <a class="brand" id="brandLink" href="#home" aria-label="Portfolio home">
                <span class="brand-mark" id="brandMark">AL</span>
                <span class="brand-copy"><strong id="brandName">ASM Lemon</strong><small id="brandSubtitle">Developer ×
                        Designer</small></span>
            </a>
            <nav class="desktop-nav" id="desktopNav" aria-label="Primary navigation"></nav>
            <div class="nav-actions">
                <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch color theme"
                    title="Switch color theme">
                    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-5.66 1.42-1.42M4.92 19.08l1.42-1.42m11.32 0 1.42 1.42M4.92 4.92l1.42 1.42M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z" />
                        </svg>
                    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z" /></svg>
                </button>
                <a class="btn btn-sm btn-primary desktop-cta" id="headerCta" href="#contact">Get in touch</a>
                <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="mobileMenu"
                    aria-label="Open navigation"><span></span><span></span><span></span></button>
            </div>
        </div>
        <div class="mobile-menu" id="mobileMenu" hidden></div>
    </header>

    <main id="main">
        <section class="hero section" id="home" aria-labelledby="heroTitle">
            <div class="container hero-grid" id="heroContent">
                <div class="loading-card">Loading portfolio…</div>
            </div>
        </section>

        <section class="trust-strip" aria-label="Core focus areas">
            <div class="container marquee-wrap" id="focusAreas"></div>
        </section>

        <section class="section" id="about">
            <div class="container two-col">
                <div class="section-heading reveal" id="aboutHeading"></div>
                <div class="about-copy reveal delay-1" id="aboutCopy"></div>
            </div>
        </section>

        <section class="section section-alt" id="experience">
            <div class="container">
                <div class="section-heading horizontal reveal" id="experienceHeading"></div>
                <div id="experienceList" class="timeline"></div>
            </div>
        </section>

        <section class="section" id="education">
            <div class="container">
                <div class="section-heading horizontal reveal" id="educationHeading"></div>
                <div id="educationGrid" class="education-grid"></div>
            </div>
        </section>

        <section class="section" id="work">
            <div class="container">
                <div class="section-heading horizontal reveal" id="workHeading"></div>
                <div class="filter-bar reveal" id="projectFilters" role="group" aria-label="Filter projects"></div>
                <div id="projectGrid" class="project-grid" aria-live="polite"></div>
            </div>
        </section>

        <section class="section section-alt" id="creative">
            <div class="container">
                <div class="section-heading horizontal reveal" id="creativeHeading"></div>
                <div id="creativeGrid" class="creative-grid"></div>
            </div>
        </section>

        <section class="section" id="research">
            <div class="container">
                <div class="section-heading horizontal reveal" id="researchHeading"></div>
                <div class="research-intro reveal" id="researchIntro"></div>
                <div id="researchGrid" class="research-grid"></div>
                <div class="research-block">
                    <div class="research-block-heading"><span class="mini-label">Applied work</span>
                        <h3>Selected exploration</h3>
                    </div>
                    <div id="researchExplorations" class="research-explorations"></div>
                </div>
                <div class="publication-note reveal" id="publicationBlock"><span>PUBLICATIONS</span>
                    <h3>Publications</h3>
                    <p id="publicationNote"></p>
                </div>
            </div>
        </section>

        <section class="section section-alt" id="media">
            <div class="container">
                <div class="section-heading horizontal reveal" id="mediaHeading"></div>
                <div class="media-toolbar reveal">
                    <div class="media-filters" id="mediaFilters" role="group" aria-label="Filter media"></div><a
                        class="text-link" href="media.html">Open media library →</a>
                </div>
                <div class="media-intro reveal" id="mediaIntro"></div>
                <div id="mediaGrid" class="media-grid" aria-live="polite"></div>
            </div>
        </section>

        <section class="section" id="skills">
            <div class="container">
                <div class="section-heading horizontal reveal" id="skillsHeading"></div>
                <div id="skillsGrid" class="skills-grid"></div>
            </div>
        </section>

        <section class="section section-alt" id="learning">
            <div class="container two-col">
                <div class="section-heading reveal" id="learningHeading"></div>
                <div id="certList" class="cert-list reveal delay-1"></div>
            </div>
        </section>

        <section class="section contact-section" id="contact">
            <div class="container" id="contactContent"></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-grid" id="footerContent"></div>
    </footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <noscript>
        <div class="noscript-note">This portfolio uses JavaScript to render content from JSON. Please enable JavaScript.
        </div>
    </noscript>

    <script src="assets/js/core.js" defer></script>
    <script src="assets/js/app.js" defer></script>
</body>

</html>
