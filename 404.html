<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found — ASM Lemon</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #07111f;
            color: #f4f7fb;
            font-family: system-ui;
            padding: 24px
        }

        .c {
            max-width: 650px;
            text-align: center
        }

        h1 {
            font-size: clamp(5rem, 18vw, 10rem);
            margin: 0;
            line-height: 1;
            background: linear-gradient(90deg, #8b72ff, #4fd1ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent
        }

        p {
            color: #98a8bd
        }

        a {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 18px;
            border-radius: 12px;
            background: #7357ff;
            color: white;
            text-decoration: none;
            font-weight: 700
        }

    </style>
</head>

<body>
    <main class="c">
        <h1>404</h1>
        <h2>Page not found.</h2>
        <p>The page you requested may have moved or is no longer available.</p><a href="./">Return to portfolio</a>
    </main>
</body>

</html>
